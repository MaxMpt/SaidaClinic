services:
  db:
    image: postgres:16-alpine
    container_name: docsaya-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: docsaya
      POSTGRES_USER: docsaya
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    volumes:
      - docsaya_pg:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docsaya -d docsaya"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - docsaya

  web:
    profiles: ["full"]
    build: .
    container_name: docsaya-web
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://docsaya:${POSTGRES_PASSWORD}@db:5432/docsaya
      DEBUG: "0"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - docsaya

volumes:
  docsaya_pg:

networks:
  docsaya:
